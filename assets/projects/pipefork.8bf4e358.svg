<svg xmlns="http://www.w3.org/2000/svg" width="440" height="190" viewBox="0 0 440 190" role="img" aria-labelledby="title">
<title id="title">PipeFork — Visual debugger for fork(), pipes and file descriptors: a C-subset compiler + simulator you can step backwards.</title>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, Menlo, monospace}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090c17"/><stop offset="1" stop-color="#120e2c"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r=".9" fill="#1c2346"/></pattern>
  <clipPath id="frame"><rect width="440" height="190" rx="18"/></clipPath>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
  
</defs>
<g clip-path="url(#frame)">
<rect width="440" height="190" fill="url(#bgGrad)"/>
<rect width="440" height="190" fill="url(#dots)"/>
<radialGradient id="cardGlow"><stop offset="0" stop-color="#fbbf24" stop-opacity=".22"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<circle cx="374" cy="64" r="150" fill="url(#cardGlow)"/>
<path d="M24 0H416" stroke="#fbbf24" stroke-width="3" opacity=".8"/>
<text class="mono" x="24" y="36" font-size="10.5" letter-spacing="1.6" fill="#fbbf24">SYSTEMS · TEACHING TOOL</text>
<text class="sans" x="24" y="66" font-size="22" font-weight="800" fill="#eceefb">PipeFork</text>
<text class="sans" x="24" y="92" font-size="12.5" fill="#a7aed0">Visual debugger for fork(), pipes and file</text>
<text class="sans" x="24" y="110" font-size="12.5" fill="#a7aed0">descriptors: a C-subset compiler +</text>
<text class="sans" x="24" y="128" font-size="12.5" fill="#a7aed0">simulator you can step backwards.</text>
<path d="M366 42L351 81M380 42L395 81" stroke="#fbbf24" stroke-opacity=".6" stroke-width="1.5"/>
<text class="mono" x="389" y="35" font-size="8.5" fill="#6c7499">fork()</text>
<rect x="356" y="88" width="34" height="9" rx="4.5" fill="none" stroke="#fbbf24" stroke-opacity=".7"/>
<circle cy="92.5" r="2" fill="#fbbf24"><animate attributeName="cx" values="360;386" dur="1.5s" begin="0s" repeatCount="indefinite"/></circle><circle cy="92.5" r="2" fill="#fbbf24"><animate attributeName="cx" values="360;386" dur="1.5s" begin="0.5s" repeatCount="indefinite"/></circle><circle cy="92.5" r="2" fill="#fbbf24"><animate attributeName="cx" values="360;386" dur="1.5s" begin="1s" repeatCount="indefinite"/></circle>
<circle cx="373" cy="32" r="11" fill="#0c1124" stroke="#fbbf24" stroke-width="1.6"/><text class="mono" x="373" y="35" font-size="8.5" fill="#eceefb" text-anchor="middle">P0</text><circle cx="345" cy="92" r="11" fill="#0c1124" stroke="#fbbf24" stroke-width="1.6"/><text class="mono" x="345" y="95" font-size="8.5" fill="#eceefb" text-anchor="middle">P1</text><circle cx="401" cy="92" r="11" fill="#0c1124" stroke="#fbbf24" stroke-width="1.6"/><text class="mono" x="401" y="95" font-size="8.5" fill="#eceefb" text-anchor="middle">P2</text>
<text class="mono" x="373" y="118" font-size="8.5" fill="#6c7499" text-anchor="middle">pipe → read()</text><rect x="24" y="150" width="83" height="21" rx="10.5" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".4"/>
<text class="mono" x="65.5" y="164.28" font-size="10.5" fill="#a7aed0" text-anchor="middle">TypeScript</text><rect x="113" y="150" width="76.7" height="21" rx="10.5" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".4"/>
<text class="mono" x="151.4" y="164.28" font-size="10.5" fill="#a7aed0" text-anchor="middle">compilers</text><rect x="195.7" y="150" width="45.2" height="21" rx="10.5" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".4"/>
<text class="mono" x="218.3" y="164.28" font-size="10.5" fill="#a7aed0" text-anchor="middle">Unix</text><text class="mono" x="416" y="164.5" font-size="10.5" fill="#6c7499" text-anchor="end">↗ my repo</text>
</g>
<rect x=".5" y=".5" width="439" height="189" rx="17.5" fill="none" stroke="#232b4d"/>
</svg>
